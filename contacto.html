<!DOCTYPE html>
<html>
    <head>
        <title>Lo quieres, te contacto</title>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="assets/style.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="assets/funciones.js" defer></script>
    </head>

    <body>
        <header>
            <div class="topbar">
                <img src="assets/img/sale.svg">
                <a href="index.html"><i>Lo quieres, te lo vendo</i></a>
            </div>
        </header>

        <main class="centered-main">
            <div class="contact">
                <div>
                    <p>Nombre:</p>
                    <input 
                    type="text" 
                    id="nameInput" 
                    onfocus="resetError(this)"
                    oninput="allowOnly(this, 'alpha', 20)"
                    >
                </div>
                
                <div>
                    <p>Teléfono:</p>
                    <input 
                    type="text" 
                    id="phoneInput" 
                    onfocus="resetError(this)"
                    oninput="allowOnly(this, 'num', 9)"
                    >
                </div>
                <div>
                    <p>E-Mail:</p>
                    <input 
                    type="text" 
                    id="emailInput" 
                    onfocus="resetError(this)"
                    oninput="allowOnly(this, 'email')"
                    >
                </div>
                <button onclick="onFormComplete()">
                    Enviar
                </button>
            </div>
        </main>

        <footer>
            <p>Somos "Lo Quieres, te lo vendo" - 2026</p>
            <a href="contacto.html"><i>Contactanos!</i></a>
        </footer>
    </body>
</html>
