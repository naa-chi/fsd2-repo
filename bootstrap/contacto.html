<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="assets/funciones.js" defer></script>
</head>
<body class="bg-light pb-5">
    <nav class="navbar navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <img src="assets/img/sale.svg" alt="Logo" width="40" height="32" class="me-2">
                <i>Lo quieres, te lo vendo</i>
            </a>
        </div>
    </nav>

    <main class="container d-flex justify-content-center my-5">
        <div class="card p-4 bg-primary text-white style="width: 100%; max-width: 500px;">
            <div class="mb-3">
                <label for="nameInput" class="form-label">Nombre:</label>
                <input type="text" class="form-control" id="nameInput" onfocus="resetError(this)" oninput="allowOnly(this, 'alpha', 20)">
            </div>
            <div class="mb-3">
                <label for="phoneInput" class="form-label">Teléfono:</label>
                <input type="text" class="form-control" id="phoneInput" onfocus="resetError(this)" oninput="allowOnly(this, 'num', 9)">
            </div>
            <div class="mb-3">
                <label for="emailInput" class="form-label">E-Mail:</label>
                <input type="text" class="form-control" id="emailInput" onfocus="resetError(this)" oninput="allowOnly(this, 'email')">
            </div>
            <button class="btn btn-dark w-100 rounded-pill" onclick="onFormComplete()">Enviar</button>
        </div>
    </main>

    <footer class="bg-primary text-white fixed-bottom p-2 d-flex justify-content-between align-items-center">
        <p class="m-0 ms-2">Somos "Lo Quieres, te lo vendo" - 2026</p>
        <a href="contacto.html" class="text-white me-2"><i>Contactanos!</i></a>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
